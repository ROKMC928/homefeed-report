const b64=(s)=>Uint8Array.from(atob(s),(c)=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(BOX.s),iterations:BOX.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(BOX.i)},key,b64(BOX.c)));
}
async function open(pw,remember){
  const msg=document.getElementById("msg");
  if(!window.crypto||!crypto.subtle){msg.textContent="보안 연결(https://)로 접속해야 열립니다.";return;}
  msg.style.color="";msg.textContent="여는 중…";
  try{
    const html=await unlock(pw);
    try{remember?localStorage.setItem("hfpw",pw):localStorage.removeItem("hfpw");}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    try{localStorage.removeItem("hfpw");}catch(e2){}
    msg.style.color="#d92d20";msg.textContent="비밀번호가 맞지 않습니다.";
  }
}
